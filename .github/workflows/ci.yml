name: ReliableVision checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Install pinned CPU runtime and constrained development dependencies
        run: |
          python -m pip install --require-hashes -r requirements/serve.lock
          python -m pip install --no-build-isolation -c requirements-lock.txt -e '.[serve,dev,validation]'
          python -m pip check
      - name: Lint and tests (synthetic only; no weights or data downloads)
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Train and evaluate offline CPU smoke model
        run: |
          python -m reliablevision.cli --config configs/smoke.toml
          python scripts/build_drift_reference.py --artifact artifacts/smoke/model.pt
      - name: Compose validation and Docker build
        run: |
          docker compose config --quiet
          docker compose build api
          docker run --rm --user 0 --mount "type=bind,source=$PWD,target=/workspace" --entrypoint python reliablevision:local /workspace/scripts/prepare_state.py
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
      - name: Actual HTTP inference, monitoring and review
        run: |
          python scripts/check_serving.py
          python scripts/simulate_traffic.py
          python scripts/check_monitoring.py
          python scripts/check_monitoring.py --queries-only
          docker compose restart api
          docker compose up -d --wait --wait-timeout 90
          python scripts/check_monitoring.py --after-restart
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --tail 50
          docker compose down
